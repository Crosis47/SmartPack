name: Paper Compatibility

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    name: Compile against Paper ${{ matrix.paper }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        paper:
          - 1.21.11-R0.1-SNAPSHOT
          - 26.1.2.build.53-stable
          - 26.3.build.222-stable
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - name: Compile and package with Java 21 bytecode
        run: mvn -B -ntp clean verify -Dpaper.api.version=${{ matrix.paper }}
      - name: Package server compatibility probe
        if: matrix.paper == '26.3.build.222-stable'
        run: jar --create --file target/compatibility-probe.jar -C target/test-classes .
      - uses: actions/upload-artifact@v4
        if: matrix.paper == '26.3.build.222-stable'
        with:
          name: compatibility-plugins
          path: target/*.jar
          if-no-files-found: error

  runtime:
    name: Run same JAR on Paper ${{ matrix.paper }} / Java ${{ matrix.java }}
    needs: compile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - paper: '1.21.11'
            java: '21'
          - paper: '26.1.2'
            java: '25'
          - paper: '26.3'
            java: '25'
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/download-artifact@v4
        with:
          name: compatibility-plugins
          path: run/plugins
      - name: Download stable Paper server
        working-directory: run
        env:
          PAPER_VERSION: ${{ matrix.paper }}
        run: |
          set -euo pipefail
          agent='SmartPack-Compatibility/1.0 (https://github.com/Crosis47/SmartPack)'
          curl -fsSL --retry 3 -A "$agent" \
            "https://fill.papermc.io/v3/projects/paper/versions/$PAPER_VERSION/builds" > builds.json
          url=$(jq -er 'first(.[] | select(.channel == "STABLE") | .downloads."server:default".url)' builds.json)
          curl -fsSL --retry 3 -A "$agent" "$url" -o server.jar
      - name: Run compatibility checks in disposable world
        working-directory: run
        env:
          PAPER_VERSION: ${{ matrix.paper }}
        run: |
          set -euo pipefail
          echo 'eula=true' > eula.txt
          cat > server.properties <<'PROPERTIES'
          server-ip=127.0.0.1
          server-port=0
          online-mode=false
          view-distance=2
          simulation-distance=2
          generate-structures=false
          level-type=minecraft:flat
          generator-settings={"layers":[{"block":"minecraft:bedrock","height":1}],"biome":"minecraft:plains"}
          PROPERTIES
          set +e
          timeout 240s java -Xms256M -Xmx1G -jar server.jar --nogui --noconsole > console.log 2>&1
          status=$?
          set -e
          cat console.log
          test "$status" -eq 0
          grep -F "SMARTPACK_COMPATIBILITY_PASS $PAPER_VERSION" console.log
          if grep -F 'SMARTPACK_COMPATIBILITY_FAIL' console.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper-${{ matrix.paper }}-logs
          path: |
            run/console.log
            run/logs/
            run/crash-reports/
